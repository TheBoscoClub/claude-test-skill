name: Security & Quality Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.0.0
        with:
          node-version: '22'

      - name: Markdown lint (markdownlint-cli pinned to the local version)
        run: |
          npm install -g --ignore-scripts markdownlint-cli@0.48.0
          markdownlint --version
          # Lint exactly the tracked files: a glob skips dot-directories without --dot, reaches .git/
          # with it, and markdownlint exits 0 when handed no files at all, so an empty list must fail.
          mapfile -d '' files < <(git ls-files -z -- '*.md')
          [ "${#files[@]}" -gt 0 ] || { echo "no tracked *.md found — refusing a vacuous pass" >&2; exit 1; }
          echo "linting ${#files[@]} tracked *.md files"
          markdownlint "${files[@]}"

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml
        continue-on-error: true

  codespell:
    name: Spelling Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run codespell
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579  # v2.2
        with:
          skip: .git,*.lock
          ignore_words_list: crate,ot
        continue-on-error: true

  security-audit:
    name: Security Patterns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."

          # Check for common secret patterns
          FINDINGS=0

          # API keys
          if grep -rE "(api[_-]?key|apikey|secret[_-]?key)\s*[=:]\s*['\"][^'\"]{8,}['\"]" \
               --include="*.md" --include="*.sh" --include="*.json" . 2>/dev/null | \
               grep -v "example\|template\|placeholder"; then
            echo "::warning::Potential API key found"
            FINDINGS=$((FINDINGS + 1))
          fi

          # AWS keys
          if grep -rE "AKIA[0-9A-Z]{16}" . 2>/dev/null; then
            echo "::error::AWS access key found!"
            FINDINGS=$((FINDINGS + 1))
          fi

          # Private keys
          if grep -rE "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----" . 2>/dev/null; then
            echo "::error::Private key found!"
            FINDINGS=$((FINDINGS + 1))
          fi

          if [[ $FINDINGS -gt 0 ]]; then
            echo "::warning::Found $FINDINGS potential security issues"
          else
            echo "✅ No secrets detected"
          fi
